<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
<style>
  :root {
    /* 品牌主色 */
    --tomato: #FF5A4F;   /* 番茄红 */
    --coral:  #FF7A45;   /* 珊瑚橙 */
    --pink:   #FF8FB8;   /* 糖果粉 */
    --mint:   #8DE2C4;   /* 薄荷绿 */
    --yellow: #FFD93D;   /* 亮黄 */
    --cream:  #FFF7F3;   /* 奶油白 */
    --ink:    #111111;   /* 黑色描边 */

    --accent: var(--tomato);          /* 随模式切换 */
    --accent-soft: rgba(255,90,79,.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background: var(--cream);
    background-image:
      radial-gradient(900px 520px at 88% -8%, rgba(255,122,69,.18), transparent 60%),
      radial-gradient(720px 500px at -8% 28%, rgba(255,143,184,.16), transparent 60%),
      radial-gradient(640px 420px at 50% 112%, rgba(255,217,61,.20), transparent 60%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
  }

  /* 漂浮粒子背景 */
  .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .particle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--ink);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-46px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  /* 海报式标题 */
  .header { margin-bottom: 26px; }
  .kicker {
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 800;
    color: var(--coral);
    margin-bottom: 6px;
  }
  .poster-title {
    display: inline-block;
    font-size: 48px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 2px;
    color: var(--ink);
    transform: rotate(-2deg);
  }
  .poster-title span {
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
  }
  .poster-title .accent { color: var(--accent); transition: color .4s; }
  .scribble {
    width: 190px;
    height: 14px;
    display: block;
    margin: 6px auto 0;
  }
  .scribble path {
    fill: none;
    stroke: var(--coral);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 1.1s .3s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* 模式切换 */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
  }
  .tab {
    flex: 1;
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .15s, box-shadow .15s, background .25s;
  }
  .tab:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .tab.active {
    background: var(--accent);
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  /* 番茄能量球 */
  .timer-wrap {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 0 auto 30px;
  }
  .timer-wrap::before {
    content: "";
    position: absolute;
    inset: -34px;
    background: radial-gradient(circle, var(--accent-soft), transparent 66%);
    filter: blur(4px);
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .65; transform: scale(.96); }
    50%      { opacity: 1;    transform: scale(1.05); }
  }

  .timer-wrap svg {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .orbit { transform-box: view-box; transform-origin: center; animation: spin 46s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .orbit-ink { stroke: rgba(17,17,17,.5); }
  .orbit-accent { stroke: var(--accent); transition: stroke .4s; }
  .body {
    fill: var(--cream);
    stroke: var(--ink);
    stroke-width: 11;
    filter: drop-shadow(0 10px 0 rgba(17,17,17,.14));
  }
  .ring-track { stroke: rgba(17,17,17,.08); stroke-width: 22; }
  .ring {
    stroke: var(--accent);
    stroke-width: 22;
    stroke-linecap: round;
    filter: drop-shadow(0 0 10px var(--accent));
    transition: stroke .4s, stroke-dashoffset .4s linear;
  }

  .time {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .core-emoji {
    font-size: 38px;
    line-height: 1;
    margin-bottom: 4px;
    filter: drop-shadow(0 3px 0 rgba(17,17,17,.25));
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .clock {
    font-size: 56px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--ink);
    line-height: 1.05;
  }
  .mode-label {
    margin-top: 8px;
    padding: 5px 14px;
    background: var(--accent);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 2px 2px 0 var(--ink);
    transition: background .4s;
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 24px;
  }
  .btn {
    font-family: inherit;
    border: 3px solid var(--ink);
    cursor: pointer;
    font-weight: 800;
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .3s;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn-primary {
    background: var(--accent);
    font-size: 18px;
    letter-spacing: 2px;
    padding: 14px 34px;
    border-radius: 40px;
  }
  .btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 20px;
  }

  /* 完成进度点 */
  .cycle {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--cream);
    transition: background .3s;
  }
  .dot.done { background: var(--accent); }

  /* 今日专注 */
  .stat {
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .stat strong {
    font-size: 20px;
    color: var(--accent);
    -webkit-text-stroke: 1px var(--ink);
    transition: color .4s;
  }

  /* 底部开关 */
  .options {
    display: flex;
    justify-content: center;
    gap: 22px;
    font-size: 13px;
    font-weight: 600;
  }
  .options label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* 设置弹层 */
  .settings-panel {
    display: none;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
    text-align: left;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .settings-panel.open { display: block; }
  .settings-panel h2 { font-size: 15px; margin-bottom: 14px; font-weight: 800; }
  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .field input {
    width: 72px;
    background: #fff;
    border: 2px solid var(--ink);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .save {
    width: 100%;
    margin-top: 6px;
    background: var(--accent);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 11px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .3s;
  }
  .save:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .save:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  @media (max-width: 360px) {
    .timer-wrap { width: 264px; height: 264px; }
    .clock { font-size: 46px; }
    .core-emoji { font-size: 32px; }
    .poster-title { font-size: 40px; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="kicker">TOMATO TIMER</div>
      <h1 class="poster-title"><span>番茄</span><span class="accent">钟</span></h1>
      <svg class="scribble" viewBox="0 0 190 14" aria-hidden="true">
        <path d="M6 9 C 50 3, 90 13, 132 7 S 176 5, 184 8"/>
      </svg>
    </header>

    <div class="tabs">
      <button class="tab active" data-mode="focus">沉浸</button>
      <button class="tab" data-mode="short">短放松</button>
      <button class="tab" data-mode="long">长放松</button>
    </div>

    <div class="timer-wrap">
      <svg viewBox="0 0 320 320" aria-hidden="true">
        <g class="orbit">
          <circle class="orbit-ink" cx="160" cy="160" r="152" fill="none" stroke-width="2" stroke-dasharray="5 16" stroke-linecap="round" opacity=".55"/>
          <circle class="orbit-accent" cx="160" cy="160" r="160" fill="none" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round" opacity=".7"/>
        </g>
        <circle class="body" cx="160" cy="160" r="134"/>
        <circle class="ring-track" cx="160" cy="160" r="112" fill="none"/>
        <circle class="ring" cx="160" cy="160" r="112" fill="none"
                stroke-dasharray="703.72" stroke-dashoffset="0"/>
      </svg>
      <div class="time">
        <div class="core-emoji" id="titleEmoji">🍅</div>
        <div class="clock" id="clock">25:00</div>
        <div class="mode-label" id="modeLabel">沉浸</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-icon" id="resetBtn" title="重置">⟲</button>
      <button class="btn btn-primary" id="startBtn">进入沉浸</button>
      <button class="btn btn-icon" id="settingsBtn" title="设置">⚙</button>
    </div>

    <div class="cycle" id="cycleDots"></div>
    <div class="stat">今日专注 <strong id="statCount">0</strong> 次</div>

    <div class="options">
      <label><input type="checkbox" id="autoStart" checked> 自动开始下一轮</label>
      <label><input type="checkbox" id="soundOn" checked> 提示音</label>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <h2>时长设置(分钟)</h2>
      <div class="field">沉浸 <input type="number" id="focusMin" min="1" max="120" value="25"></div>
      <div class="field">短放松 <input type="number" id="shortMin" min="1" max="60" value="5"></div>
      <div class="field">长放松 <input type="number" id="longMin" min="1" max="60" value="15"></div>
      <button class="save" id="saveBtn">保存</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // —— 状态 ——
  const MODES = {
    focus: { name: "沉浸", running: "沉浸中", emoji: "🍅", start: "进入沉浸" },
    short: { name: "短放松", running: "放松中", emoji: "☕", start: "开始放松" },
    long:  { name: "长放松", running: "放松中", emoji: "🌴", start: "开始放松" },
  };
  const COLORS = {
    focus: { main: "#FF5A4F", soft: "rgba(255,90,79,.22)" },
    short: { main: "#8DE2C4", soft: "rgba(141,226,196,.30)" },
    long:  { main: "#FFD93D", soft: "rgba(255,217,61,.32)" },
  };
  const CYCLE_LENGTH = 4;                 // 每 4 次沉浸后进入长放松
  const RING_R = 112;
  const RING_C = 2 * Math.PI * RING_R;    // 圆环周长
  const STORE_KEY = "pomodoro.today";

  let durations = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
  let mode = "focus";
  let timeLeft = durations.focus;
  let running = false;
  let timer = null;
  let completed = 0;                       // 本轮已完成的沉浸次数

  // —— 今日专注(当日沉浸完成次数)——
  function todayStamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  let todayCount = 0;
  (function loadToday() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (raw && raw.date === todayStamp()) todayCount = raw.count || 0;
    } catch (e) { /* 忽略 */ }
  })();
  function saveToday() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ date: todayStamp(), count: todayCount }));
    } catch (e) { /* 忽略 */ }
  }

  // —— DOM ——
  const $ = (id) => document.getElementById(id);
  const clockEl = $("clock"), modeLabel = $("modeLabel"), titleEmoji = $("titleEmoji");
  const ringEl = document.querySelector(".ring");
  const startBtn = $("startBtn"), resetBtn = $("resetBtn");
  const statCountEl = $("statCount");
  const autoStartEl = $("autoStart"), soundEl = $("soundOn");

  ringEl.style.strokeDasharray = RING_C;

  // —— 声音(Web Audio,无需外部文件)——
  let audioCtx = null;
  function chime() {
    if (!soundEl.checked) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.28, now + i * 0.2 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.2 + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.2);
      });
    } catch (e) { /* 忽略音频错误 */ }
  }

  function notify(title, body) {
    try {
      if (Notification.permission === "granted") new Notification(title, { body });
    } catch (e) { /* 忽略 */ }
  }

  // —— 渲染 ——
  function fmt(s) {
    const m = Math.floor(s / 60), r = s % 60;
    return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
  }

  function updateButton() {
    startBtn.textContent = running ? "暂停" : MODES[mode].start;
  }

  function render() {
    clockEl.textContent = fmt(timeLeft);
    modeLabel.textContent = running ? MODES[mode].running : MODES[mode].name;
    titleEmoji.textContent = MODES[mode].emoji;
    statCountEl.textContent = todayCount;

    // 圆环:剩余越多越满,随时间耗尽
    const frac = timeLeft / durations[mode];
    ringEl.style.strokeDashoffset = RING_C * (1 - frac);

    // 主题色
    document.documentElement.style.setProperty("--accent", COLORS[mode].main);
    document.documentElement.style.setProperty("--accent-soft", COLORS[mode].soft);

    // 标签高亮
    document.querySelectorAll(".tab").forEach((t) =>
      t.classList.toggle("active", t.dataset.mode === mode));

    // 进度点
    const dots = $("cycleDots");
    dots.innerHTML = "";
    for (let i = 0; i < CYCLE_LENGTH; i++) {
      const d = document.createElement("span");
      d.className = "dot" + (i < completed % CYCLE_LENGTH ? " done" : "");
      dots.appendChild(d);
    }

    document.title = `${clockEl.textContent} · ${modeLabel.textContent} — 番茄钟`;
  }

  // —— 计时逻辑 ——
  function tick() {
    timeLeft--;
    if (timeLeft <= 0) { onComplete(); return; }
    render();
  }

  function start() {
    if (running) return;
    running = true;
    updateButton();
    timer = setInterval(tick, 1000);
    requestNotification();
  }

  function pause() {
    running = false;
    updateButton();
    clearInterval(timer);
  }

  function toggle() { running ? pause() : start(); }

  function reset() {
    pause();
    timeLeft = durations[mode];
    render();
  }

  function switchMode(next) {
    mode = next;
    pause();
    timeLeft = durations[mode];
    render();
  }

  function onComplete() {
    clearInterval(timer);
    running = false;
    chime();

    let next;
    if (mode === "focus") {
      completed++;
      todayCount++;
      saveToday();
      next = (completed % CYCLE_LENGTH === 0) ? "long" : "short";
      notify("番茄钟", "沉浸完成,放松一下吧");
    } else {
      next = "focus";
      notify("番茄钟", "放松结束,继续沉浸吧");
    }
    switchMode(next);
    if (autoStartEl.checked) start();
  }

  function requestNotification() {
    try {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    } catch (e) { /* 忽略 */ }
  }

  // —— 漂浮粒子背景 ——
  (function spawnParticles() {
    const bg = document.querySelector(".bg");
    const palette = ["#FF5A4F", "#FF7A45", "#FF8FB8", "#8DE2C4", "#FFD93D"];
    const n = 12;
    for (let i = 0; i < n; i++) {
      const p = document.createElement("span");
      p.className = "particle";
      const size = 6 + Math.random() * 14;
      p.style.width = p.style.height = size + "px";
      p.style.left = (Math.random() * 100).toFixed(1) + "%";
      p.style.top = (Math.random() * 100).toFixed(1) + "%";
      p.style.background = palette[i % palette.length];
      p.style.opacity = (0.25 + Math.random() * 0.35).toFixed(2);
      p.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + "s";
      p.style.animationDelay = (-Math.random() * 12).toFixed(1) + "s";
      bg.appendChild(p);
    }
  })();

  // —— 事件绑定 ——
  startBtn.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);
  $("settingsBtn").addEventListener("click", () =>
    $("settingsPanel").classList.toggle("open"));

  document.querySelectorAll(".tab").forEach((t) =>
    t.addEventListener("click", () => switchMode(t.dataset.mode)));

  $("saveBtn").addEventListener("click", () => {
    const read = (id) => Math.max(1, parseInt($(id).value, 10) || 1) * 60;
    durations = { focus: read("focusMin"), short: read("shortMin"), long: read("longMin") };
    reset();
    $("settingsPanel").classList.remove("open");
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      toggle();
    }
  });

  updateButton();
  render();
})();
</script>
</body>
</html>
